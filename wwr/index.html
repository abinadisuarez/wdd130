<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Rapids</title>
    <meta name="description" content="Welcome to our hub. Get to know the team behind the adventures, explore an overview of what we offer, and browse quick snapshots of real trips to inspire your next journey.">
    <meta name="author" content="Hector Abinadi Suarez Valderrama">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-crossedoars.png" alt="Rapids" width="100">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/rafting4_600.jpg" alt="Hero Image">
            <h1>Your Adventure Starts Here – Get to Know Us & Our Trips</h1>
            <a href="trips.html" class="hero-cta">Explore Our Trips & Book Yours!</a>
            <signupform>
                <form action="#">
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder">
                    </div>
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder">
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="subscribe" name="subscribe" checked>
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>
                    <button type="submit">Get in Touch!</button>
                </form> 
            </signupform>
        </div>
        <section class="offers-section">
            <h2>What we Offer</h2>
            <div class="offers-grid">
                <figure>
                    <img src="images/rafting1.jpg" alt="Rafting through narrow canyons">
                    <figcaption>Rapids</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting3.jpg" alt="People smiling on a raft">
                    <figcaption>Rivers</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting59_600.jpg" alt="Calm waters between rapids">
                    <figcaption>Campings</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 | Rapids | Hector Abinadi Suarez Valderrama</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon" width="20">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon" width="20">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon" width="20">
            </a>
        </nav>
    </footer>
</body>

</html>
