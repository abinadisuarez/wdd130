<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us - Rapids</title>
    <meta name="description" content="This page provides contact details, information about the owners and staff, and a form to reach out with any questions or requests.">
    <meta name="author" content="Hector Abinadi Suarez Valderrama">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-crossedoars.png" alt="Rapids" width="100">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="address-section">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>
        <div class="content-container">
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.6175393165243!2d-73.9868544!3d40.7484405!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c259a9b3117469%3A0xd134e199a405a163!2sEmpire+State+Building!5e0!3m2!1sen!2sus!4v1234567890123" 
                    width="450" 
                    height="450" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
            <form action="#">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder">
                </div>
                <div class="form-row align-start">
                    <span class="label-mock">Message Purpose</span>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="purpose" value="general" checked> General Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation"> Reservation Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="suggestion"> Website Suggestion
                        </label>
                    </div>
                </div>
                <div class="form-row align-start">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="3" placeholder="Type here"></textarea>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="subscribe" name="subscribe" checked>
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form> 
        </div>
        <section class="profiles-section">
            <h2>We are Here to Serve you!</h2>
            <div class="profiles-grid">
                <figure>
                    <img src="images/profile1.jpg" alt="Employee 1">
                    <figcaption>Employee 1</figcaption>
                </figure>
                <figure>
                    <img src="images/profile2.jpg" alt="Employee 2">
                    <figcaption>Employee 2</figcaption>
                </figure>
                <figure>
                    <img src="images/profile3.jpg" alt="Employee 3">
                    <figcaption>Employee 3</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 | Rapids | Hector Abinadi Suarez Valderrama</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon" width="20">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon" width="20">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon" width="20">
            </a>
        </nav>
    </footer>
</body>

</html>
